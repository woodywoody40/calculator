<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Woody 匯率</title>
    <meta name="description" content="即時匯率計算機，極致木質美學設計。">
    <meta name="theme-color" content="#0d0d0d">
    
    <!-- PWA Tags -->
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2933/2933116.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WoodyRate">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400..900;1,400..900&family=Inter:wght@200;300;400;500;600&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
      :root {
        --gold: #d9a75e;
        --gold-bright: #f4d092;
        --obsidian: #0d0d0d;
        --walnut: #2a1f18;
      }

      body {
        font-family: 'Inter', 'Noto Sans TC', sans-serif;
        background-color: #050505; 
        color: #ffffff;
        overscroll-behavior-y: none;
        -webkit-tap-highlight-color: transparent;
        height: 100dvh;
        overflow: hidden;
      }
      
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0; 
        opacity: 0.03; 
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      
      /* THE WOODY CONSOLE - A high-end display element */
      .woody-console {
        background: linear-gradient(145deg, #1a1512 0%, #0a0807 100%);
        border: 1px solid rgba(217, 167, 94, 0.2);
        box-shadow: 
          0 20px 40px -10px rgba(0, 0, 0, 0.9),
          inset 0 1px 1px rgba(255, 255, 255, 0.05);
        position: relative;
        overflow: hidden;
      }

      .woody-console::after {
        content: "";
        position: absolute;
        inset: 0;
        background-image: url("https://www.transparenttextures.com/patterns/dark-wood.png");
        opacity: 0.1;
        pointer-events: none;
        mix-blend-mode: overlay;
      }

      .woody-console-inner {
        position: relative;
        z-index: 1;
        background: radial-gradient(circle at top right, rgba(217, 167, 94, 0.05) 0%, transparent 70%);
      }
      
      .glass-keypad-btn {
        position: relative;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.02);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        color: #a1a1aa;
      }
      
      .glass-keypad-btn:active {
        transform: scale(0.96);
        background: rgba(217, 167, 94, 0.08);
        border-color: rgba(217, 167, 94, 0.2);
      }
      
      .glass-keypad-operator {
        color: var(--gold);
        background: rgba(217, 167, 94, 0.03);
      }

      .glass-keypad-action {
        background: linear-gradient(135deg, var(--gold), #967035);
        border: none;
        box-shadow: 0 8px 20px -5px rgba(217, 167, 94, 0.3);
        color: #1a1512;
        font-weight: 700;
      }

      .ripple {
        position: absolute;
        border-radius: 50%;
        transform: scale(0);
        animation: ripple 0.6s ease-out;
        background-color: rgba(217, 167, 94, 0.15); 
        pointer-events: none;
      }
      
      @keyframes ripple {
        to { transform: scale(4); opacity: 0; }
      }

      .number-pop {
        animation: numberPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      @keyframes numberPop {
        0% { transform: translateY(5px); opacity: 0; }
        100% { transform: translateY(0); opacity: 1; }
      }

      .gold-text {
        background: linear-gradient(to bottom, #f4d092, #d9a75e);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body>
    <div class="bg-noise"></div>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
